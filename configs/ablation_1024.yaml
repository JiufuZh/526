base: configs/qlora_512.yaml
project:
  name: group8_defect_detection
  seed: 42
  output_root: outputs

data:
  dataset_name: google/code_x_glue_cc_defect_detection
  cache_dir: data/processed/code_x_glue_cc_defect_detection
  text_column: func
  label_column: target
  positive_label: 1
  negative_label: 0
  deduplicate: true
  normalize_whitespace: true
model:
  base_model: Qwen/Qwen2.5-7B-Instruct
  tokenizer_name: Qwen/Qwen2.5-7B-Instruct
  max_length: 1024
  prompt_variant: detailed
training:
  run_name: ablation_qwen25_7b_qlora_1024
  train_fraction: 1.0
  balanced_smoke_n: null
  epochs: 3
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 0.3
  logging_steps: 20
  save_steps: 500
  eval_steps: 500
  eval_strategy: steps
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: true
  report_to: wandb
  class_weighting: true
  label_smoothing: 0.0
  focal_loss_gamma: null
lora:
  enabled: true
  use_4bit: true
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
evaluation:
  primary_metric: macro_f1
  generation_max_new_tokens: 8
  inference_batch_size: 2
  classification_mode: logprob
  fewshot_k: 4
