project:
  name: group8_defect_detection
  seed: 42
  output_root: outputs

data:
  dataset_name: google/code_x_glue_cc_defect_detection
  cache_dir: data/processed/code_x_glue_cc_defect_detection
  text_column: func
  label_column: target
  positive_label: 1
  negative_label: 0
  deduplicate: true
  normalize_whitespace: true

encoder:
  run_name: graphcodebert_defect_baseline
  model_name: microsoft/graphcodebert-base
  max_length: 512
  epochs: 3
  learning_rate: 0.00002
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  weight_decay: 0.01
  warmup_ratio: 0.06
  logging_steps: 50
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  bf16: true
  fp16: false
  report_to: wandb
